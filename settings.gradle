pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'jitpack'
			url = "https://jitpack.io"
		}
		maven {
			name = 'cursemaven'
			url = "https://www.cursemaven.com"
			content {
				includeGroup "curse.maven"
			}
		}
		mavenCentral()
		gradlePluginPortal()
	}
}
rootProject.name = "KinastMinecraftLauncher"