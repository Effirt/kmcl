
plugins {
	id("java")
	id("com.gradleup.shadow") version "9.0.0"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

group = "cd.cc.effirt"
version = "${project.mod_version}"

repositories {
	mavenCentral()
	gradlePluginPortal()
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "AuroraLib"
        url = uri("https://maven.pkg.github.com/Effirt/AuroraLib")
		credentials {
			username = project.findProperty("gpr.user")
			password = project.findProperty("gpr.key")
		}
    }
}

dependencies {
	implementation "cd.cc.effirt:auroralib:1.0.0"

	annotationProcessor "info.picocli:picocli-codegen:4.7.6"
	implementation "info.picocli:picocli:4.7.6"

	implementation "com.google.code.gson:gson:2.13.1"
	implementation "net.raphimc:MinecraftAuth:5.0.2"
}


compileJava {
	options.compilerArgs += [
		"-Aproject=${project.group}.${project.mod_package}"
	]
}


jar {
	enabled = false
}

shadowJar {
	archiveBaseName.set("${project.mod_name}")
	archiveClassifier.set("")
	archiveVersion.set("")
	mergeServiceFiles()
	manifest {
		attributes(
				"Main-Class": "${project.group}.${project.mod_package}.Main",
				"Implementation-Version": "${project.mod_version}"
		)
	}
	exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
	exclude "fabric.mod.json"
}

processResources {
	def modVersion = project.mod_version
	inputs.property "version", modVersion
	filesMatching("kmcl.properties") {
		expand "version": modVersion
	}
}
