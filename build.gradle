
plugins {
	id("java")
	id("com.gradleup.shadow") version "9.0.0"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

version = "0.5.0"
group = "kinastminecraftlauncher"

repositories {
	mavenCentral()
	gradlePluginPortal()
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "jitpack"
		url = "https://jitpack.io"
	}
	maven {
		name = "cursemaven"
		url = "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	flatDir {
		dirs "lib"
	}
}

dependencies {
	implementation "Util:Util:1.0.0"

	annotationProcessor "info.picocli:picocli-codegen:4.7.6"
	implementation "info.picocli:picocli:4.7.6"

	implementation "com.google.code.gson:gson:2.13.1"
	implementation "net.raphimc:MinecraftAuth:5.0.2"
}


compileJava {
	options.compilerArgs += [
		"-Aproject=cd.cc.effirt.${project.group}"
	]
}


jar {
	enabled = false
}

shadowJar {
	archiveClassifier.set("")
	archiveVersion.set("")
	mergeServiceFiles()
	manifest {
		attributes(
		"Main-Class": "cd.cc.effirt.${project.group}.Main"
		)
	}
	exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
	exclude "fabric.mod.json"
	exclude "icon.png"
	exclude "Example.mixin.json"
	exclude "net/lenni0451/commons/httpclient/executor/extra/**"
}

processResources {	
	def ver = project.version
	inputs.property "ver", ver
	filesMatching("kmcl.properties") {
		expand "version": ver
	}
}
