
plugins {
	id("java")
	id("com.gradleup.shadow") version "9.0.0"
	id("org.graalvm.buildtools.native") version "1.1.11"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

group = "cd.cc.effirt"
version = "${project.mod_version}"

repositories {
	mavenCentral()
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

dependencies {
	implementation "com.github.Effirt:AuroraLib:1.0.0"

	implementation "info.picocli:picocli:4.7.6"
	annotationProcessor "info.picocli:picocli-codegen:4.7.6"

	implementation "com.google.code.gson:gson:${project.gson}"
	implementation "net.raphimc:MinecraftAuth:${project.MinecraftAuth}"
}

compileJava {
	options.compilerArgs += [
		"-Aproject=${project.group}.${project.mod_package}"
	]
}

jar {
	enabled = false
}

shadowJar {
	archiveBaseName.set("${project.mod_name}")
	archiveClassifier.set("")
	archiveVersion.set("")
	mergeServiceFiles()
	manifest {
		attributes(
			"Main-Class": "${project.group}.${project.mod_package}.Main",
			"Implementation-Version": "${project.mod_version}"
		)
	}
	exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
	exclude "net/lenni0451/commons/httpclient/executor/extra/**"
}

processResources {
	def modVersion = "${project.mod_version}"
	inputs.property "version", modVersion
	filesMatching("kmcl.properties") {
		expand "version": modVersion
	}
}

graalvmNative {
	binaries {
		main {
			imageName = "kmcl"
			mainClass = "${project.group}.${project.mod_package}.Main"
			classpath(tasks.named("shadowJar"))
			buildArgs.addAll("--color=always","--no-fallback","--enable-https","--enable-http")
		}
	}
}

tasks.named("nativeCompile") {
	dependsOn(tasks.named("shadowJar"))
}
